<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ApexTrades | Deposit</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">ApexTrades</div>

<nav>
<a href="dashboard.html">Dashboard</a>
<a href="trade.html">Trade</a>
<a href="wallet.html">Wallet</a>
<a href="profile.html">Profile</a>
</nav>

</header>

<section class="hero">

<h1>Deposit Funds</h1>

<p>Fund your ApexTrades account quickly and securely.</p>

</section>

<section class="markets">

<div class="card">

<h3>Current Balance</h3>

<p id="balance">$1000.00</p>

</div>

<div class="card">

<h3>Minimum Deposit</h3>

<p>$1.00</p>

</div>

</section>

<section class="markets">

<div class="card">

<h2>Make a Deposit</h2>

<label>Deposit Amount (USD)</label>

<input
type="number"
id="amount"
min="1"
value="1"
placeholder="Enter amount">

<br><br>

<label>Payment Method</label>

<select id="paymentMethod">

<option>Mobile Money (M-Pesa)</option>
<option>USDT (TRC20)</option>
<option>Bitcoin (BTC)</option>
<option>Ethereum (ETH)</option>
<option>Binance Pay</option>

</select>

<br><br>

<button class="btn" onclick="depositMoney()">
Deposit Now
</button>

</div>

</section>

<footer>

<p>© 2026 ApexTrades. All Rights Reserved.</p>

</footer>

<script src="storage.js"></script>

<script>

document.getElementById("balance").innerHTML =
"$" + getBalance().toFixed(2);

function depositMoney(){

const amount =
Number(document.getElementById("amount").value);

if(amount < 1){
alert("Minimum deposit is $1.00");
return;
}

addDeposit(amount);

document.getElementById("balance").innerHTML =
"$" + getBalance().toFixed(2);

alert("Deposit successful!");

}

</script>

</body>
</html>
