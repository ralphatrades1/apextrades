<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ApexTrades | Withdraw</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">ApexTrades</div>

<nav>
<a href="dashboard.html">Dashboard</a>
<a href="trade.html">Trade</a>
<a href="wallet.html">Wallet</a>
<a href="profile.html">Profile</a>
</nav>

</header>

<section class="hero">

<h1>Withdraw Funds</h1>

<p>Withdraw your funds securely from your ApexTrades account.</p>

</section>

<section class="markets">

<div class="card">

<h3>Available Balance</h3>

<p id="balance">$1000.00</p>

</div>

<div class="card">

<h3>Minimum Withdrawal</h3>

<p>$1.00</p>

</div>

</section>

<section class="markets">

<div class="card">

<h2>Request a Withdrawal</h2>

<label>Withdrawal Amount (USD)</label>

<input
type="number"
id="amount"
min="1"
value="1">

<label>Withdrawal Method</label>

<select id="withdrawMethod">

<option>Mobile Money (M-Pesa)</option>
<option>USDT (TRC20)</option>
<option>Bitcoin (BTC)</option>
<option>Ethereum (ETH)</option>
<option>Bank Transfer</option>

</select>

<label>Phone Number / Wallet Address / Bank Account</label>

<input
type="text"
id="destination"
placeholder="Enter M-Pesa number, wallet address or bank account">

<button class="btn" onclick="withdrawMoney()">
Withdraw Now
</button>

</div>

</section>

<footer>

<p>© 2026 ApexTrades. All Rights Reserved.</p>

</footer>

<script src="storage.js"></script>

<script>

document.getElementById("balance").innerHTML =
"$" + getBalance().toFixed(2);

function withdrawMoney(){

const amount =
Number(document.getElementById("amount").value);

if(amount < 1){
alert("Minimum withdrawal is $1.00");
return;
}

if(amount > getBalance()){
alert("Insufficient balance.");
return;
}

addWithdrawal(amount);

document.getElementById("balance").innerHTML =
"$" + getBalance().toFixed(2);

alert("Withdrawal request submitted successfully!");

}

</script>

</body>
</html>
