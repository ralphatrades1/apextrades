<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRJ Binary Trade</title>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#08111f;
color:white;
}

header{
height:65px;
background:#101827;
display:flex;
align-items:center;
justify-content:space-between;
padding:20px;
}

.logo{
font-size:24px;
font-weight:bold;
}

.balance{
color:#22c55e;
font-size:18px;
font-weight:bold;
}

.container{

display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
padding:20px;

}

.left{

background:#111827;
border-radius:15px;
padding:20px;

}

.right{

background:#111827;
border-radius:15px;
padding:20px;

}

.market{

display:flex;
justify-content:space-between;
margin-bottom:15px;

}

.symbol{

font-size:22px;
font-weight:bold;

}

.price{

font-size:32px;
color:#38bdf8;
font-weight:bold;

}

#chart{

height:420px;

}

.section{

margin-top:20px;

}

.section h3{

margin-bottom:10px;

}

.select{

width:100%;
padding:12px;
background:#1f2937;
color:white;
border:none;
border-radius:10px;
margin-bottom:15px;

}

input{

width:100%;
padding:12px;
background:#1f2937;
color:white;
border:none;
border-radius:10px;
margin-bottom:15px;

}

.buyup{

width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
font-size:18px;
cursor:pointer;
margin-bottom:10px;

}

.buydown{

width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#dc2626;
color:white;
font-size:18px;
cursor:pointer;

}

.timer{

text-align:center;
font-size:28px;
margin-top:20px;

}

.result{

text-align:center;
margin-top:15px;
font-size:18px;
font-weight:bold;

}

.history{

margin-top:30px;

}

.trade-item{

padding:10px;
background:#1f2937;
border-radius:8px;
margin-bottom:10px;

}

@media(max-width:900px){

.container{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

TRJ Binary

</div>

<div class="balance">

Balance £1000.00

</div>

</header>

<div class="container">

<div class="left">

<div class="market">

<div>

<div class="symbol">

BTC/USD

</div>

<div class="price" id="price">

100.000

</div>

</div>

</div>

<div id="chart"></div>

</div>

<div class="right">

<div class="section">

<h3>Contract Type</h3>

<select class="select" id="contract">

<option>Rise/Fall</option>

<option>Even/Odd</option>

<option>Match/Differs</option>

</select>

<h3>Stake</h3>

<input
type="number"
id="stake"
value="10">

<button
class="buyup"
onclick="buy('UP')">

🟢 BUY UP

</button>

<button
class="buydown"
onclick="buy('DOWN')">

🔴 BUY DOWN

</button>

<div class="timer">

<span id="timer">

10

</span>s

</div>

<div
class="result"
id="result">

Ready to trade

</div>

<div
class="history"
id="history">

<h3>Trade History</h3>
