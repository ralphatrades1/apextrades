<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRJ Trade</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
body{
    margin:0;
    background:#08111f;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    background:#111827;
    padding:20px;
    display:flex;
    justify-content:space-between;
}

.balance{
    color:#22c55e;
}

.container{
    padding:15px;
}

.card{
    background:#111827;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.price{
    font-size:32px;
    color:#38bdf8;
}

#chart{
    height:300px;
}

button{
    padding:12px;
    border:0;
    border-radius:8px;
    margin:5px;
    color:white;
    background:#1f2937;
}

input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:0;
}

.up{
    width:100%;
    background:#16a34a;
}

.down{
    width:100%;
    background:#dc2626;
}

.timer{
    text-align:center;
    font-size:24px;
    margin-top:15px;
}
</style>

</head>

<body>

<div class="header">
<h2>TRJ Trade</h2>
<div class="balance">Balance: £1,000</div>
</div>


<div class="container">

<div class="card">
<h3>BTC/USD</h3>
<div class="price" id="price">100.000</div>
</div>


<div class="card">
<h3>Live Chart</h3>
<div id="chart"></div>
</div>


<div class="card">

<h3>Trade Options</h3>

<button>Rise/Fall</button>
<button>Even/Odd</button>
<button>Match</button>
<button>Differs</button>

<br>

<input type="number" placeholder="Stake amount">


<button class="up" onclick="trade('UP')">
🟢 BUY UP
</button>

<button class="down" onclick="trade('DOWN')">
🔴 BUY DOWN
</button>


<div class="timer">
Time: <span id="time">10</span>s
</div>

</div>

</div>



<script>

const chart = LightweightCharts.createChart(
document.getElementById("chart"),
{
width: window.innerWidth - 30,
height:300
}
);


const series = chart.addSeries(
LightweightCharts.CandlestickSeries
);


let price = 100;

let data=[];


function candle(){

let open=price;

let close=open+(Math.random()-0.5);

let high=Math.max(open,close)+0.5;

let low=Math.min(open,close)-0.5;


price=close;


data.push({
time:Math.floor(Date.now()/1000),
open:open,
high:high,
low:low,
close:close
});


series.setData(data.slice(-30));


document.getElementById("price").innerHTML=
price.toFixed(3);

}


setInterval(candle,2000);



let t=10;

setInterval(()=>{

t--;

document.getElementById("time").innerHTML=t;

if(t<=0){
t=10;
}

},1000);



function trade(direction){

alert("Trade placed: BUY "+direction);

}

</script>


</body>
</html>
