<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ApexTrades</title>

<link rel="stylesheet" href="trade.css">

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body>

<header class="topbar">

    <div class="logo">
        ApexTrades
    </div>

    <div class="top-right">

        <div class="balance">
            £1,000.00
        </div>

        <button class="deposit">
            Deposit
        </button>

    </div>

</header>

<main>

<section class="market">

    <div>

        <h2>BTC/USD</h2>

        <div id="price">
            100.000
        </div>

    </div>

    <div class="status">
        ● LIVE
    </div>

</section>

<section class="chart-card">

    <div id="chart"></div>

</section>

<section class="contracts">

    <button class="active">Rise/Fall</button>

    <button>Even/Odd</button>

    <button>Over/Under</button>

    <button>Matches/Differs</button>

</section>

<section class="trade-box">

    <label>Stake (£)</label>

    <input
        type="number"
        id="stake"
        value="10"
    >

    <div class="quick">

        <button>£1</button>
        <button>£5</button>
        <button>£10</button>
        <button>£25</button>
        <button>£50</button>

    </div>

    <button class="buy-up">
        🟢 BUY UP
    </button>

    <button class="buy-down">
        🔴 BUY DOWN
    </button>

</section>

</main>

<nav class="bottom-nav">

    <button>Trade</button>

    <button>Wallet</button>

    <button>History</button>

    <button>AI</button>

    <button>Profile</button>

</nav>

<script src="trade.js"></script>

</body>
</html>
