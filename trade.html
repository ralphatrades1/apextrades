<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRJ Binary</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#0b1220;
color:#fff;
overflow-x:hidden;
}

header{
height:60px;
background:#141d2d;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 16px;
border-bottom:1px solid #202c42;
}

.logo{
font-size:20px;
font-weight:700;
color:#4f8cff;
}

.balance{
background:#1b2740;
padding:8px 14px;
border-radius:10px;
color:#57d98d;
font-weight:600;
}

.deposit{
background:#2f7cff;
padding:10px 16px;
border-radius:10px;
font-weight:600;
margin-left:10px;
}

.header-right{
display:flex;
align-items:center;
}

main{
padding:16px;
}

.asset{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.asset-name{
font-size:18px;
font-weight:700;
}

.asset-price{
font-size:32px;
font-weight:700;
color:#4fd3ff;
margin-top:4px;
}

.live{
background:#198754;
padding:6px 12px;
border-radius:20px;
font-size:13px;
}

</style>

</head>

<body>

<header>

<div class="logo">
TRJ Binary
</div>

<div class="header-right">

<div class="balance">
£1,000.00
</div>

<div class="deposit">
Deposit
</div>

</div>

</header>

<main>

<div class="asset">

<div>

<div class="asset-name">
BTC/USD
</div>

<div class="asset-price" id="price">
100.000
</div>

</div>

<div class="live">
● LIVE
</div>

</div>
<div class="chart-card">

    <div class="chart-header">

        <span>Live Market</span>

        <span id="marketStatus">Open</span>

    </div>

    <div id="chart"></div>

</div>

<style>

.chart-card{
    background:#141d2d;
    border-radius:16px;
    padding:15px;
    margin-bottom:18px;
    border:1px solid #202c42;
}

.chart-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    font-size:14px;
    color:#9fb2d0;
}

#chart{
    width:100%;
    height:380px;
    border-radius:12px;
    background:#0f1728;
}

</style>
