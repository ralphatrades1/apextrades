<!DOCTYPE html>
<html>
<head>
    <title>TRJ Binary - Trade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
<a href="dashboard.html">Dashboard</a> |
<a href="wallet.html">Wallet</a> |
<a href="trade.html">Trade</a> |
<a href="history.html">History</a> |
<a href="profile.html">Profile</a>
</nav>

<h1>TRJ Binary Trading</h1>

<div class="card">

<h2>Market</h2>

<select>
<option>Rise / Fall</option>
<option>Even / Odd</option>
<option>Match / Differs</option>
</select>

<br><br>

<h2>Live Market Price</h2>

<h1 id="price">100.00</h1>

<label>Stake (£)</label><br>
<input id="stake" type="number" placeholder="10">

<br><br>

<button onclick="buyUp()">BUY UP</button>

<button onclick="buyDown()">BUY DOWN</button>

<p id="result"></p>

</div>

<script>

let price = 100;

setInterval(function(){

price += (Math.random()-0.5);

document.getElementById("price").innerHTML =
price.toFixed(2);

},1000);

function buyUp(){

let stake=document.getElementById("stake").value;

if(stake==""){
alert("Enter a stake");
return;
}

document.getElementById("result").innerHTML=
"Trade submitted: BUY UP (£"+stake+")";

}

function buyDown(){

let stake=document.getElementById("stake").value;

if(stake==""){
alert("Enter a stake");
return;
}

document.getElementById("result").innerHTML=
"Trade submitted: BUY DOWN (£"+stake+")";

}

</script>

</body>
</html>
