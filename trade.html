<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ApexTrades | Trade</title>

<link rel="stylesheet" href="trade.css">

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<header class="topbar">

<div class="logo">
ApexTrades
</div>

<div class="account">

<span>Balance</span>

<h2 id="balance">$1000.00</h2>

</div>

</header>

<section class="trade-container">

<div class="left-panel">

<h2>Market</h2>

<input
type="text"
id="searchMarket"
placeholder="Search market...">

<select id="market" size="20">

<optgroup label="Forex">

<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>USD/CHF</option>
<option>USD/CAD</option>
<option>AUD/USD</option>
<option>NZD/USD</option>
<option>EUR/GBP</option>
<option>EUR/JPY</option>
<option>GBP/JPY</option>

</optgroup>

<optgroup label="Crypto">

<option>BTC/USD</option>
<option>ETH/USD</option>
<option>BNB/USD</option>
<option>SOL/USD</option>
<option>XRP/USD</option>
<option>ADA/USD</option>
<option>DOGE/USD</option>

</optgroup>

<optgroup label="Synthetic">

<option>Volatility 10 Index</option>
<option>Volatility 10 (1s)</option>
<option>Volatility 25 Index</option>
<option>Volatility 25 (1s)</option>
<option>Volatility 50 Index</option>
<option>Volatility 50 (1s)</option>
<option>Volatility 75 Index</option>
<option>Volatility 75 (1s)</option>
<option>Volatility 100 Index</option>
<option>Volatility 100 (1s)</option>

<option>Boom 300 Index</option>
<option>Boom 500 Index</option>
<option>Boom 600 Index</option>
<option>Boom 900 Index</option>
<option>Boom 1000 Index</option>

<option>Crash 300 Index</option>
<option>Crash 500 Index</option>
<option>Crash 600 Index</option>
<option>Crash 900 Index</option>
<option>Crash 1000 Index</option>

<option>Jump 10 Index</option>
<option>Jump 25 Index</option>
<option>Jump 50 Index</option>
<option>Jump 75 Index</option>
<option>Jump 100 Index</option>

<option>Step Index</option>

<option>Range Break 100</option>
<option>Range Break 200</option>

</optgroup>

</select>

</div>

<div class="chart-panel">

<div class="chart-header">

<h2 id="selectedMarket">
BTC/USD
</h2>

<select id="timeframe">

<option>30 Seconds</option>
<option>1 Minute</option>
<option>3 Minutes</option>
<option>5 Minutes</option>

</select>

</div>

<div id="chart"></div>

</div>
