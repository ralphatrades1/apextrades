<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ApexTrades | Trade</title>

<link rel="stylesheet" href="trade.css">

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<header class="topbar">

<div class="logo">

ApexTrades

</div>

<div class="wallet">

<span>Balance</span>

<h2 id="balance">$1000.00</h2>

</div>

</header>

<section class="market-header">

<div class="market-left">

<select id="market">

<option selected>BTC/USD</option>

<option>ETH/USD</option>

<option>EUR/USD</option>

<option>GBP/USD</option>

<option>Volatility 10 Index</option>

<option>Volatility 25 Index</option>

<option>Volatility 50 Index</option>

<option>Volatility 75 Index</option>

<option>Volatility 100 Index</option>

<option>Boom 1000</option>

<option>Crash 1000</option>

</select>

</div>

<div class="market-right">

<span class="live-dot">●</span>

<span id="price">100.00</span>

</div>

</section>

<section class="chart-area">

<div id="chart"></div>

</section>

<div class="floating-buttons">

<button id="buyUp">

🟢 BUY

</button>

<button id="buyDown">

🔴 SELL

</button>

</div>

<section class="bottom-sheet">

<div class="sheet-handle"></div>

<div class="tabs">

<button class="tab active">

Trade

</button>

<button class="tab">

Positions

</button>

<button class="tab">

History

</button>

</div>
