<!DOCTYPE html>
<html>
<head>
    <title>TRJ Binary - Trade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
<a href="dashboard.html">Dashboard</a> |
<a href="wallet.html">Wallet</a> |
<a href="trade.html">Trade</a> |
<a href="history.html">History</a> |
<a href="profile.html">Profile</a>
</nav>

<h1>TRJ Binary Trading</h1>

<div class="card">

<h2>Live Market</h2>

<h1 id="price">100.00</h1>

<p>Status: 🟢 Live</p>

<label>Select Market</label>

<select id="market">
<option>Rise / Fall</option>
<option>Even / Odd</option>
<option>Match / Differs</option>
</select>

<br><br>

<label>Stake (£)</label>

<input id="stake" type="number" placeholder="Enter amount">

<br>

<button onclick="buy('BUY UP')">BUY UP</button>

<button onclick="buy('BUY DOWN')">BUY DOWN</button>

<p id="result"></p>

</div>

<div class="card">

<h2>Current Balance</h2>

<h1>£0.00</h1>

</div>

<script>

let price = 100;

setInterval(function(){

price += (Math.random()-0.5);

document.getElementById("price").innerHTML =
price.toFixed(2);

},1000);

function buy(type){

let stake=document.getElementById("stake").value;

if(stake==""){
alert("Enter a stake amount");
return;
}

let market=document.getElementById("market").value;

document.getElementById("result").innerHTML =
"Trade Submitted<br><br>" +
"Type: " + type + "<br>" +
"Market: " + market + "<br>" +
"Stake: £" + stake;

}

</script>

</body>
</html>
