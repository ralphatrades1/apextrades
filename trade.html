<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ApexTrades | Trade</title>

<link rel="stylesheet" href="trade.css">

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<header class="topbar">

<div class="logo">

ApexTrades

</div>

<div class="account">

<span>Balance</span>

<h2 id="balance">$1000.00</h2>

</div>

</header>

<section class="market-bar">

<input
type="text"
id="searchMarket"
placeholder="Search market...">

<select id="market">

<optgroup label="Forex">

<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>USD/CHF</option>
<option>USD/CAD</option>
<option>AUD/USD</option>
<option>NZD/USD</option>
<option>EUR/GBP</option>
<option>EUR/JPY</option>
<option>GBP/JPY</option>

</optgroup>

<optgroup label="Crypto">

<option selected>BTC/USD</option>
<option>ETH/USD</option>
<option>BNB/USD</option>
<option>SOL/USD</option>
<option>XRP/USD</option>
<option>ADA/USD</option>
<option>DOGE/USD</option>

</optgroup>

<optgroup label="Volatility">

<option>Volatility 10 Index</option>
<option>Volatility 10 (1s)</option>
<option>Volatility 25 Index</option>
<option>Volatility 25 (1s)</option>
<option>Volatility 50 Index</option>
<option>Volatility 50 (1s)</option>
<option>Volatility 75 Index</option>
<option>Volatility 75 (1s)</option>
<option>Volatility 100 Index</option>
<option>Volatility 100 (1s)</option>

</optgroup>

<optgroup label="Boom">

<option>Boom 300</option>
<option>Boom 500</option>
<option>Boom 600</option>
<option>Boom 900</option>
<option>Boom 1000</option>

</optgroup>

<optgroup label="Crash">

<option>Crash 300</option>
<option>Crash 500</option>
<option>Crash 600</option>
<option>Crash 900</option>
<option>Crash 1000</option>

</optgroup>

<optgroup label="Jump">

<option>Jump 10</option>
<option>Jump 25</option>
<option>Jump 50</option>
<option>Jump 75</option>
<option>Jump 100</option>

</optgroup>

<optgroup label="Other">

<option>Step Index</option>
<option>Range Break 100</option>
<option>Range Break 200</option>

</optgroup>

</select>

<select id="timeframe">

<option>30 Seconds</option>
<option>1 Minute</option>
<option>3 Minutes</option>
<option>5 Minutes</option>

</select>

</section>

<section class="chart-section">

<div class="chart-header">

<h2 id="selectedMarket">BTC/USD</h2>

<div class="live-price">

<span id="price">100.00</span>

<span class="status">● LIVE</span>

</div>

</div>

<div id="chart"></div>
</section>

<section class="trade-panel">

<div class="trade-box">

<h3>Trade Mode</h3>

<select id="tradeMode">

<option value="time">Time Contracts</option>

<option value="tick">Tick Contracts</option>

</select>

<h3>Contract Type</h3>

<select id="contractType">

<option value="risefall">Rise/Fall</option>

<option value="higherlower">Higher/Lower</option>

<option value="evenodd">Even/Odd</option>

<option value="overunder">Over/Under</option>

<option value="matchesdiffers">Matches/Differs</option>

</select>

<div id="timeBox">

<h3>Duration</h3>

<select id="duration">

<option value="30">30 Seconds</option>

<option value="60">1 Minute</option>

<option value="180">3 Minutes</option>

<option value="300">5 Minutes</option>

</select>

</div>

<div id="tickBox" style="display:none;">

<h3>Ticks</h3>

<select id="ticks">

<option>1 Tick</option>

<option>2 Ticks</option>

<option>5 Ticks</option>

<option>10 Ticks</option>

<option>25 Ticks</option>

<option>50 Ticks</option>

<option>100 Ticks</option>

</select>

</div>

<div id="barrierBox" style="display:none;">

<h3>Barrier Price</h3>

<input
type="number"
id="barrier"
placeholder="Enter barrier price">

</div>

<h3>Prediction Digit</h3>

<div class="digit-grid">

<button type="button" class="digit-btn active" data-digit="0">0</button>
<button type="button" class="digit-btn" data-digit="1">1</button>
<button type="button" class="digit-btn" data-digit="2">2</button>
<button type="button" class="digit-btn" data-digit="3">3</button>
<button type="button" class="digit-btn" data-digit="4">4</button>

<button type="button" class="digit-btn" data-digit="5">5</button>
<button type="button" class="digit-btn" data-digit="6">6</button>
<button type="button" class="digit-btn" data-digit="7">7</button>
<button type="button" class="digit-btn" data-digit="8">8</button>
<button type="button" class="digit-btn" data-digit="9">9</button>

</div>

<input type="hidden" id="predictionDigit" value="0">

<p>
Selected Digit:
<strong id="selectedDigit">0</strong>
</p>

<h3>Stake (USD)</h3>

<input
type="number"
id="stake"
value="1"
min="1">

<div class="quick-stakes">

<button>$1</button>
<button>$5</button>
<button>$10</button>
<button>$25</button>
<button>$50</button>

</div>

<div class="trade-info">

<div>

<p>Payout</p>

<h2 id="payout">95%</h2>

</div>

<div>

<p>Duration</p>

<h2 id="timer">00:30</h2>

</div>

</div>

<button class="buy-up" id="buyUp">

🟢 BUY UP

</button>

<button class="buy-down" id="buyDown">

🔴 BUY DOWN

</button>

</div>

<div class="history-box">

<h3>Recent Trades</h3>

<table>

<thead>

<tr>

<th>Market</th>

<th>Type</th>

<th>Result</th>

<th>P/L</th>

</tr>

</thead>

<tbody id="recentTrades">

<tr>

<td colspan="4">

No trades yet

</td>

</tr>

</tbody>

</table>

</div>

</section>

<script src="storage.js"></script>

<script src="trade.js"></script>

</body>

</html>
