<!DOCTYPE html>
<html>
<head>
    <title>TRJ Binary - Trade</title>
</head>
<body>

<h1>TRJ Binary Trading</h1>

<a href="dashboard.html">Dashboard</a> |
<a href="wallet.html">Wallet</a>

<hr>

<h2>Select Market</h2>

<select>
    <option>Even / Odd</option>
    <option>Rise / Fall</option>
    <option>Match / Differs</option>
</select>

<br><br>

<label>Stake (£)</label><br>
<input type="number" placeholder="Enter stake">

<br><br>

<button onclick="buyTrade()">Buy Trade</button>

<p id="result"></p>

<script>
function buyTrade() {
    document.getElementById("result").innerHTML =
    "Trade placed successfully.";
}
</script>

<hr>
<h2>Live Market</h2>

<h1 id="price">100.00</h1>

<script>
let price = 100.00;

setInterval(function () {
    let change = (Math.random() - 0.5).toFixed(2);
    price = (parseFloat(price) + parseFloat(change)).toFixed(2);
    document.getElementById("price").innerHTML = price;
}, 1000);
</script>
<h2>Open Trades</h2>
<p>No active trades.</p>

</body>
</html>
