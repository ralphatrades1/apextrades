<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexTrades Login</title>

<link rel="stylesheet" href="style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#090f1c;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.login-box{
background:#111827;
width:100%;
max-width:420px;
padding:35px;
border-radius:20px;
box-shadow:0 0 30px rgba(0,255,120,.15);
}

.logo{
text-align:center;
font-size:36px;
font-weight:bold;
color:#00d26a;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#b5b5b5;
margin-bottom:30px;
}

input{
width:100%;
padding:16px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:#1d2636;
color:#fff;
font-size:16px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:#00d26a;
color:#fff;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00b85d;
}

.bottom{
text-align:center;
margin-top:20px;
color:#b5b5b5;
}

.bottom a{
color:#00d26a;
text-decoration:none;
font-weight:bold;
}
</style>

</head>

<body>

<div class="login-box">

<div class="logo">ApexTrades</div>

<div class="subtitle">
Trade Smart. Trade Apex.
</div>

<input type="email" placeholder="Email Address">

<input type="password" placeholder="Password">

<button onclick="window.location.href='dashboard.html'">
Login
</button>

<div class="bottom">
Don't have an account?
<a href="signup.html">Create Account</a>
</div>

</div>

</body>
</html>
