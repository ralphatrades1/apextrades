<!DOCTYPE html>
<html>
<head>
<title>TRJ Binary Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo">TRJ Binary</div>

<nav>
<a href="index.html">Home</a>
<a href="#">Wallet</a>
<a href="#">Profile</a>
</nav>
</header>

<div class="container">

<div class="wallet">

<h2>Wallet</h2>

<h1>£0.00</h1>

<button class="btn">Deposit</button>
<button class="btn">Withdraw</button>

</div>

<div class="trade">

<h2>Trade</h2>

<label>Contract Type</label>

<select>

<option>Rise/Fall</option>

<option>Even/Odd</option>

<option>Match/Differs</option>

<option>Higher/Lower</option>

<option>Over/Under</option>

</select>

<br><br>

<label>Stake (£)</label>

<input type="number" placeholder="10">

<br><br>

<label>Duration</label>

<select>

<option>1 Minute</option>

<option>5 Minutes</option>

<option>15 Minutes</option>

</select>

<br><br>

<button class="buy">BUY UP</button>

<button class="sell">BUY DOWN</button>

</div>

<div class="history">

<h2>Trade History</h2>

<p>No trades yet.</p>

</div>

</div>

</body>

</html>
