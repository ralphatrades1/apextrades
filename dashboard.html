<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexTrades Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
    <div class="brand">
        <h2>ApexTrades</h2>
    </div>

    <ul>
        <li>🏠 Dashboard</li>
        <li onclick="location.href='trade.html'">📈 Trade</li>
        <li onclick="location.href='wallet.html'">💼 Wallet</li>
    </ul>
</div>

<div class="main">

<div class="hero-card">
    <h1>ApexTrades</h1>
    <p>Trade Smart. Trade Apex.</p>

    <div class="hero-top">
        <div class="balance-box">
            <h3>Balance</h3>
            <h1>$1000.00</h1>
        </div>

        <div class="icon-btn">🔔</div>
        <div class="icon-btn">👤</div>
    </div>
</div>

<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Balance</h3>
<h1>$1000.00</h1>
</div>

<div class="card">
<h3>Today's Profit</h3>
<h1>$0.00</h1>
</div>

<div class="card">
<h3>Open Trades</h3>
<h1>0</h1>
</div>

<div class="card">
<h3>Win Rate</h3>
<h1>0%</h1>
</div>

</div>

<div class="recent">
<h2>Recent Activity</h2>
<p>No recent transactions.</p>
</div>

</div>

</body>
</html>
