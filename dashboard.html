<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApexTrades Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#08111f;
color:white;
}

.header{
height:70px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
border-bottom:1px solid #222;
}

.logo{
font-size:30px;
font-weight:bold;
color:#00d26a;
}

.balance{
background:#1a2434;
padding:12px 20px;
border-radius:12px;
font-weight:bold;
color:#00d26a;
}

.container{
display:flex;
min-height:calc(100vh - 70px);
}

.sidebar{
width:230px;
background:#111827;
padding:20px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}

.sidebar a:hover{
background:#00d26a;
}

.main{
flex:1;
padding:25px;
}

.card{
background:#111827;
padding:20px;
border-radius:18px;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.stat{
background:#182234;
padding:20px;
border-radius:15px;
text-align:center;
}

.stat h2{
color:#00d26a;
margin-top:10px;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
display:flex;
overflow:auto;
}

.sidebar a{
white-space:nowrap;
margin-right:10px;
}

}

</style>

</head>

<body>

<div class="header">

<div class="logo">
ApexTrades
</div>

<div class="balance">
Balance: $1000.00
</div>

</div>

<div class="container">

<div class="sidebar">

<a href="#">🏠 Dashboard</a>

<a href="trade.html">📈 Trade</a>

<a href="wallet.html">💰 Wallet</a>

<a href="history.html">📄 History</a>

<a href="profile.html">👤 Profile</a>

<a href="#">⚙ Settings</a>

</div>

<div class="main">

<h1>Welcome Back</h1>

<p style="margin-top:10px;margin-bottom:25px;color:#9ca3af;">
Trade with confidence on ApexTrades.
</p>
