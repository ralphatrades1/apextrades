<!DOCTYPE html>
<html>
<head>
    <title>TRJ Binary - Trade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>TRJ Binary</h1>

<nav>
<a href="dashboard.html">Dashboard</a> |
<a href="wallet.html">Wallet</a> |
<a href="trade.html">Trade</a> |
<a href="history.html">History</a> |
<a href="profile.html">Profile</a>
</nav>

<hr>

<h2>Trade</h2>

<div class="card">
    <h3>Market</h3>

    <select>
        <option>Rise/Fall</option>
        <option>Even/Odd</option>
        <option>Match/Differs</option>
        <option>Higher/Lower</option>
        <option>Over/Under</option>
    </select>

    <br><br>

    <h3>Live Price</h3>
    <h1 id="price">100.00</h1>

    <button onclick="changePrice()">Refresh Price</button>

    <br><br>

    <label>Stake (£)</label><br>
    <input type="number" placeholder="10">

    <br><br>

    <label>Duration</label><br>
    <select>
        <option>1 Minute</option>
        <option>5 Minutes</option>
        <option>15 Minutes</option>
    </select>

    <br><br>

    <button>BUY UP</button>
    <button>BUY DOWN</button>
</div>

<script>
function changePrice() {
    let price = (100 + Math.random() * 10).toFixed(2);
    document.getElementById("price").innerHTML = price;
}
</script>

</body>
</html>
